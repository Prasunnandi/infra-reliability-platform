version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: reliability_backend
    ports:
      - "5002:5002"
    environment:
      - PORT=5002
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: reliability_frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped
